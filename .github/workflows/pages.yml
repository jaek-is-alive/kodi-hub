name: Build & deploy Kodi repo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build repo zips + addons.xml(.md5)
        run: python3 tools/build_repo.py

      - name: Assemble Pages site (zips served at site root)
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R zips/. _site/
          cp tools/pages_index.html _site/index.html
          # short-URL + add-source copy of the repo zip at the site root
          cp zips/repository.jacobshub/repository.jacobshub-*.zip _site/hub.zip

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
